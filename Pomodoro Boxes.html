<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Boxes</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#22201d;--mute:#77726b;--line:#dcd8d0;--done:#2f6f5e;--carry:#c9772b;--empty:#fff;--warn:#fbeadb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191816;--card:#232220;--ink:#eeebe5;--mute:#9a958c;--line:#3a3833;--done:#4fa78f;--carry:#e0913f;--empty:#232220;--warn:#3a2c1e}}
:root[data-theme="dark"]{--bg:#191816;--card:#232220;--ink:#eeebe5;--mute:#9a958c;--line:#3a3833;--done:#4fa78f;--carry:#e0913f;--empty:#232220;--warn:#3a2c1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.top,.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hd{margin-bottom:8px}
.count{font-size:2.2rem;font-weight:700;line-height:1}
.count small{font-size:1rem;color:var(--mute);font-weight:400}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;font-size:1.2rem}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.5;cursor:not-allowed}
button.go{background:var(--done);border-color:var(--done);color:#fff;font-weight:700;padding:8px 18px}
button.sm{padding:3px 10px;font-size:.9rem}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:16px}
.box{aspect-ratio:1;border:2px solid var(--line);background:var(--empty);border-radius:6px;display:flex;align-items:center;justify-content:center}
.box.carry{border-color:var(--carry)}
.box.on{background:var(--done);border-color:var(--done)}
.box.on.carry{background:var(--carry);border-color:var(--carry)}
.box.on::after{content:"✓";color:#fff;font-weight:700}
.box.live{border-style:dashed;border-color:var(--done)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:.9rem;margin-top:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--line);vertical-align:-1px;margin-right:6px}
.sw.c{border-color:var(--carry)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.mute{color:var(--mute)}
.clock{font-size:3.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin:6px 0}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn);border:1px solid var(--carry);border-radius:8px;padding:10px 12px;margin:10px 0}
.err{background:var(--warn);border:1px solid var(--carry);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.gap{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.92rem}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;list-style-position:inside}
details .row{padding-left:18px}
</style>
</head>
<body>
<main>
  <h1>Pomodoro boxes</h1>
  <p class="sub"><span id="date"></span> · <span id="sync">Saved on this device</span></p>

  <section class="panel">
    <div class="top">
      <div class="count"><span id="done">0</span><small> of <span id="planned">0</span> done today</small></div>
      <div class="step" role="group" aria-label="Daily target">
        <span class="mute">Daily target</span>
        <button id="minus" aria-label="Fewer boxes">−</button>
        <strong id="base" style="min-width:1.5em;text-align:center">8</strong>
        <button id="plus" aria-label="More boxes">+</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="sw"></span>Today's boxes</span>
      <span><span class="sw c"></span>Carried over from earlier days</span>
      <span>Boxes fill only when a session is finished</span>
    </div>
    <div class="gap"><button id="forgive">Clear carried-over boxes</button></div>
  </section>

  <section class="panel" id="focus"></section>

  <section class="panel">
    <div class="hd"><h2>Done today</h2></div>
    <div id="log"></div>
  </section>

  <section class="panel">
    <div class="hd">
      <div><h2>History</h2><span class="mute" id="hcount"></span></div>
      <div id="exports" hidden class="step">
        <button class="sm" id="expcsv">Download CSV</button>
        <button class="sm" id="expjson">Backup JSON</button>
      </div>
    </div>
    <div id="hist"></div>
  </section>
</main>
<script>
const KEY='pomodoro-boxes-v1', DUR=25*60*1000, GRACE=60*1000, NCHECK=2;
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||typeof S!=='object')S={def:8,days:{},reset:null};
if(S.checks===undefined)S.checks=true;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const fmtTime=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

/* ---------- storage: this device + your private account storage ---------- */
let col=null,synced={},tmr=null,flushing=false,again=false;
function setStatus(s){
  $('sync').textContent={local:'Saved on this device only',saving:'Saving…',synced:'All entries saved to your account',error:'Sync failed, retrying. Entries are safe on this device'}[s];
}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){localSave();if(col){setStatus('saving');clearTimeout(tmr);tmr=setTimeout(flush,700);}}
const metaDoc=()=>({def:S.def,reset:S.reset||null,checks:S.checks,timer:S.timer||null,await:S.await||null});
async function flush(){
  if(!col)return;
  if(flushing){again=true;return;}
  flushing=true;let ok=true;
  try{
    const docs={meta:metaDoc()};
    for(const d in S.days)docs['d_'+d]=S.days[d];
    for(const k in docs){
      const j=JSON.stringify(docs[k]);
      if(synced[k]===j)continue;
      await col.doc(k).set(JSON.parse(j));
      synced[k]=j;
    }
    setStatus('synced');
  }catch(e){ok=false;setStatus('error');clearTimeout(tmr);tmr=setTimeout(flush,15000);}
  flushing=false;
  if(again&&ok){again=false;flush();}
}
async function initDb(){
  if(!window.claude||!claude.use)return;
  claude.use('downloads').then(d=>{if(d)$('exports').hidden=false;}).catch(()=>{});
  try{
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!user||!db)return;
    const id=await user.id();
    if(!id)return;
    const c=db.collection('data/users/'+id);
    const snap=await c.get();
    snap.docs.forEach(doc=>{
      const raw=doc.data();if(!raw)return;
      const v=JSON.parse(JSON.stringify(raw));
      if(doc.id==='meta'){
        if(v.def!=null)S.def=v.def;
        S.reset=v.reset||null;
        if(v.checks!==undefined)S.checks=v.checks;
        S.timer=v.timer||null;S.await=v.await||null;
      }else if(doc.id.startsWith('d_')){
        const d=doc.id.slice(2),loc=S.days[d];
        if(!loc||(v.log||[]).length>=(loc.log||[]).length){S.days[d]=v;synced[doc.id]=JSON.stringify(v);}
      }
    });
    col=c;localSave();phase=null;tick();setStatus('saving');flush();
  }catch(e){setStatus('local');}
}

/* ---------- days and carryforward ---------- */
function compute(){
  const today=iso(new Date());
  const keys=Object.keys(S.days).sort();
  let start=keys[0]||today;
  if(S.reset&&S.reset>start)start=S.reset;
  if(start>today)start=today;
  const rows=[];let carry=0;
  for(let d=start;d<=today;d=addDays(d,1)){
    const rec=S.days[d]||(S.days[d]={base:S.def,done:0});
    if(!rec.log)rec.log=[];
    const planned=rec.base+carry,done=Math.min(rec.done,planned);
    rows.push({d,rec,base:rec.base,carry,planned,done,left:planned-done});
    carry=planned-done;
  }
  return rows;
}
const today=()=>{const r=compute();return r[r.length-1];};

/* ---------- sound / alerts ---------- */
let AC=null,msg='',phase=null;
function beep(n){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<(n||1);i++){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.frequency.value=880;g.gain.value=.15;o.start(AC.currentTime+i*.35);o.stop(AC.currentTime+i*.35+.2);}}catch(e){}}
function notify(t){try{if(window.Notification&&Notification.permission==='granted')new Notification(t);}catch(e){}}

/* ---------- session logic ---------- */
function startSession(task){
  const start=Date.now(),checks=[];
  if(S.checks)for(let i=0;i<NCHECK;i++)checks.push({at:start+DUR*(.2+i*.35+Math.random()*.25),acked:false});
  S.timer={task,start,checks};msg='';save();
  try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
  beep(1);tick();
}
function voidSession(why){S.timer=null;msg='Session voided: '+why+' No box earned.';save();}
function evalTimer(){
  const T=S.timer;if(!T)return;
  const now=Date.now();
  for(const c of T.checks){if(!c.acked&&now>c.at+GRACE){voidSession('a check-in was missed.');return;}}
  if(now>=T.start+DUR){S.await={task:T.task};S.timer=null;save();beep(3);notify('25 minutes done. Log what you finished to earn the box.');}
}

/* ---------- rendering ---------- */
function render(){
  const rows=compute(),t=rows[rows.length-1];
  $('date').textContent=new Date(t.d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('done').textContent=t.done;$('planned').textContent=t.planned;$('base').textContent=t.base;
  $('forgive').disabled=t.carry===0;
  const grid=$('grid');grid.innerHTML='';
  for(let i=0;i<t.planned;i++){
    const b=document.createElement('div');
    b.className='box'+(i<t.carry?' carry':'')+(i<t.done?' on':'')+(S.timer&&i===t.done?' live':'');
    b.setAttribute('role','img');b.setAttribute('aria-label','Box '+(i+1)+(i<t.done?', done':', not done'));
    grid.appendChild(b);
  }
  const entryHtml=e=>'<div class="row"><span><b>'+esc(e.task)+'</b><br><span class="mute">'+esc(e.note)+'</span></span><span class="mute">'+fmtTime(e.at)+'</span></div>';
  $('log').innerHTML=t.rec.log.length?t.rec.log.map(entryHtml).join(''):'<p class="mute" style="margin:0">No finished sessions yet today.</p>';

  const map={};rows.forEach(r=>map[r.d]=r);
  const keys=Object.keys(S.days).filter(d=>d<t.d).sort().reverse();
  let total=0;Object.values(S.days).forEach(r=>total+=(r.log||[]).length);
  $('hcount').textContent=total+' sessions logged across '+Object.keys(S.days).length+' days';
  const h=$('hist');
  h.innerHTML=keys.length?'':'<p class="mute" style="margin:0">Nothing yet. Past days will show up here.</p>';
  keys.forEach(d=>{
    const log=S.days[d].log||[],r=map[d];
    const label=new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const stat=r?r.done+' of '+r.planned+(r.left?' ('+r.left+' carried forward)':''):log.length+' sessions';
    const det=document.createElement('details');
    det.innerHTML='<summary><span>'+label+'</span><span class="mute">'+stat+'</span></summary>'+(log.length?log.map(entryHtml).join(''):'<div class="mute" style="padding-left:18px">No sessions logged.</div>');
    h.appendChild(det);
  });
}

function renderFocus(){
  const f=$('focus'),t=today();document.title='Pomodoro Boxes';
  if(phase==='run'){
    f.innerHTML='<h2>Focus session</h2><div><b>'+esc(S.timer.task)+'</b></div><div class="clock" id="clock">25:00</div>'+
      '<div id="ci"></div><div class="mute">'+(S.checks?'Check-ins confirmed: <span id="cnt">0</span> of '+NCHECK+'. Closing this page during a check-in voids the session.':'Check-ins are off.')+'</div>'+
      '<div class="gap"><button id="abandon">Abandon session</button></div>';
    $('abandon').onclick=()=>{if(confirm('Abandon this session? No box will be earned.')){S.timer=null;msg='Session abandoned. No box earned.';save();tick();}};
  }else if(phase==='note'){
    f.innerHTML='<h2>25 minutes done</h2><p style="margin:8px 0">You worked on <b>'+esc(S.await.task)+'</b>. Write what you actually finished to earn the box.</p>'+
      '<textarea id="note" placeholder="e.g. Solved 2 LeetCode mediums, wrote the Postgres schema"></textarea>'+
      '<div class="gap"><button class="go" id="submit" disabled>Earn box</button><span class="mute">At least 15 characters.</span></div>';
    const n=$('note');n.oninput=()=>{$('submit').disabled=n.value.trim().length<15;};
    $('submit').onclick=()=>{const tt=today();tt.rec.log.push({task:S.await.task,note:n.value.trim(),at:Date.now()});
      tt.rec.done=tt.done+1;S.await=null;save();tick();};
  }else{
    const blocked=t.left===0;
    f.innerHTML='<h2>Start a focus session</h2>'+(msg?'<div class="err" style="margin-top:8px">'+esc(msg)+'</div>':'')+
      (blocked?'<p style="margin:8px 0 0">All boxes for today are done. Raise the daily target to keep going.</p>':
      '<div style="margin-top:8px"><input type="text" id="task" maxlength="80" placeholder="What exactly will you work on?" aria-label="Task"></div>'+
      '<div class="gap"><button class="go" id="start" disabled>Start 25:00</button>'+
      '<label class="chk"><input type="checkbox" id="chk"'+(S.checks?' checked':'')+'> Random check-ins</label></div>'+
      '<p class="mute" style="margin:10px 0 0;font-size:.9rem">The timer counts real time, so it keeps running if you switch tabs. You earn the box only after 25 minutes and a note about what you finished.</p>');
    if(!blocked){
      const ti=$('task');ti.oninput=()=>{$('start').disabled=ti.value.trim().length<3;};
      $('start').onclick=()=>startSession(ti.value.trim());
      $('chk').onchange=e=>{S.checks=e.target.checked;save();};
    }
  }
}

function updateRun(){
  const T=S.timer,now=Date.now(),left=Math.max(0,T.start+DUR-now);
  const txt=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');
  if(!$('clock'))return;
  $('clock').textContent=txt;document.title=txt+' · '+T.task;
  if($('cnt'))$('cnt').textContent=T.checks.filter(c=>c.acked).length;
  const c=T.checks.find(c=>!c.acked&&now>=c.at),ci=$('ci');
  if(c){
    if(!c.pinged){c.pinged=true;save();beep(2);notify('Still working? Confirm now or the session is voided.');}
    if(!$('ack')){
      ci.innerHTML='<div class="banner"><span>Still working? Confirm within <b id="secs"></b>s or the session is voided.</span><button class="go" id="ack">I\'m working</button></div>';
      $('ack').onclick=()=>{c.acked=true;save();ci.innerHTML='';};
    }
    $('secs').textContent=Math.max(0,Math.ceil((c.at+GRACE-now)/1000));
  }else if(ci.innerHTML)ci.innerHTML='';
}

function tick(){
  evalTimer();
  const p=S.timer?'run':S.await?'note':'idle';
  if(p!==phase){phase=p;renderFocus();render();}
  if(p==='run')updateRun();
}

/* ---------- export ---------- */
async function exportFile(kind){
  try{
    const dl=await claude.use('downloads');if(!dl)return;
    if(kind==='csv'){
      const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
      const lines=['date,time,task,note'];
      Object.keys(S.days).sort().forEach(d=>(S.days[d].log||[]).forEach(e=>lines.push([d,q(fmtTime(e.at)),q(e.task),q(e.note)].join(','))));
      await dl.save({filename:'pomodoro-entries.csv',data:lines.join('\n')});
    }else{
      await dl.save({filename:'pomodoro-backup.json',data:JSON.stringify({exported:new Date().toISOString(),settings:{def:S.def,reset:S.reset,checks:S.checks},days:S.days},null,2)});
    }
  }catch(e){}
}
$('expcsv').onclick=()=>exportFile('csv');
$('expjson').onclick=()=>exportFile('json');

$('plus').onclick=()=>{const t=today();t.rec.base=Math.min(60,t.rec.base+1);S.def=t.rec.base;save();render();renderFocus();};
$('minus').onclick=()=>{const t=today();t.rec.base=Math.max(0,t.rec.base-1);S.def=t.rec.base;save();render();renderFocus();};
$('forgive').onclick=()=>{if(confirm('Clear all carried-over boxes and start fresh today?')){S.reset=iso(new Date());save();render();renderFocus();}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
setInterval(tick,500);
tick();
initDb();
</script>
</body>
</html>
